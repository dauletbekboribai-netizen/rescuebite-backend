          type: string
          pattern: ^(restaurant|shelter|driver)$
          title: Entity Type
        entity_id:
          type: integer
          title: Entity Id
        approved:
          type: boolean
          title: Approved
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - entity_type
      - entity_id
      - approved
      title: VerificationRequest
    VerificationStatus:
      type: string
      enum:
      - pending
      - verified
      - rejected
      title: VerificationStatus
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      example:
        code: forbidden
        message: insufficient role
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
